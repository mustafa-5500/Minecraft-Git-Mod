plugins {
    // The -remap variant is used for obfuscated Minecraft versions such as 1.21.x.
    // Use 'net.fabricmc.fabric-loom' for the unobfuscated 26.x versions.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Loom adds the Minecraft, Mojang and Fabric repositories for you.
// JGit and its transitive libraries come from Maven Central.
repositories {
    mavenCentral()
}

loom {
    // Keep client-only code in src/client so it never loads on a dedicated server.
    splitEnvironmentSourceSets()

    mods {
        "minecraftgit" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Versions are defined in gradle.properties. Check https://fabricmc.net/develop
    // for the latest combination for your Minecraft version.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is required for client commands, events and lifecycle hooks.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JGit is a pure-Java Git implementation, so the mod does not need a Git
    // executable on the player's machine. JavaEWAH is one of JGit's runtime
    // dependencies and is not present in Minecraft, so both are nested in the
    // remapped mod jar by Loom's `include` configuration.
    implementation "org.eclipse.jgit:org.eclipse.jgit:${project.jgit_version}"
    include "org.eclipse.jgit:org.eclipse.jgit:${project.jgit_version}"
    include "com.googlecode.javaewah:JavaEWAH:${project.javaewah_version}"

    // Pure-JVM tests for coordinate math, CSV round-trips and JGit repositories.
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// ---------------------------------------------------------------------------
// Resource processing - inject Gradle properties into fabric.mod.json
// ---------------------------------------------------------------------------
def resourceProperties = [
        version          : project.version,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version,
        java_version     : project.java_version
]

processResources {
    inputs.properties(resourceProperties)

    filesMatching('fabric.mod.json') {
        expand(resourceProperties)
    }
}

// ---------------------------------------------------------------------------
// Compilation settings
// ---------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
    }
    // Also publish a sources jar; Loom includes it in the build.
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------
publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// ---------------------------------------------------------------------------
// Dev log
// ---------------------------------------------------------------------------
// Create or open today's dev log without needing dev-log on the PATH.
// Usage: gradlew devLog [-Pdate=YYYY-MM-DD] [-Pdeveloper="Name"] [-PnoOpen]
tasks.register('devLog', Exec) {
    group = 'documentation'
    description = "Create or open today's dev log entry (Utils/dev-log-generator)."
    workingDir = projectDir

    def scriptArgs = ["${projectDir}/Utils/dev-log-generator/generate_dev_log.py"]
    if (project.hasProperty('date')) {
        scriptArgs += ['--date', project.property('date')]
    }
    if (project.hasProperty('developer')) {
        scriptArgs += ['--developer', project.property('developer')]
    }
    if (project.hasProperty('noOpen')) {
        scriptArgs += ['--no-open']
    }

    commandLine(['python', *scriptArgs])
}


// ---------------------------------------------------------------------------
// Documentation
// ---------------------------------------------------------------------------
tasks.register('documentation', Exec) {
    group = 'documentation'
    description = "Create or Update the documentation files (Documentation/)"
    workingDir = projectDir

    def scriptArgs = ["${projectDir}/Utils/documentation-generator/generate_docs.py"]
    scriptArgs += "${projectDir}/src"
    scriptArgs += "${projectDir}/Documentation"

    commandLine(['python', *scriptArgs]) 
}
